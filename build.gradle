plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '0.1.0-alpha'
group = 'com.fontainerepublic'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'fontainerepublic'
            mods {
                fontainerepublic {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'fontainerepublic'
            mods {
                fontainerepublic {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.18'
}

tasks.withType(ProcessResources).configureEach {
    filesMatching('META-INF/mods.toml') {
        expand(version: project.version)
    }
}

// 锁定 Forge 版本，升级需显式修改
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('playerDataTest', JavaExec) {
    group = 'verification'
    description = 'Runs dependency-free FR-DATA-002 player-data validation.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.fontainerepublic.server.playerdata.PlayerDataTestMain'
}

tasks.register('networkFoundationTest', JavaExec) {
    group = 'verification'
    description = 'Runs dependency-free FR-NET-001 network foundation validation.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.fontainerepublic.common.network.NetworkFoundationTestMain'
    systemProperty 'fontainerepublic.projectDir', project.projectDir.absolutePath
}

tasks.register('commandFoundationTest', JavaExec) {
    group = 'verification'
    description = 'Runs dependency-free FR-CMD-001 command foundation validation.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.fontainerepublic.server.command.CommandFoundationTestMain'
    systemProperty 'fontainerepublic.projectDir', project.projectDir.absolutePath
}

tasks.register('durableCommitTest', JavaExec) {
    group = 'verification'
    description = 'Runs dependency-free FR-CORE-002 durable commit validation.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.fontainerepublic.core.DurableCommitTestMain'
    systemProperty 'fontainerepublic.projectDir', project.projectDir.absolutePath
}

tasks.register('auditFoundationTest', JavaExec) {
    group = 'verification'
    description = 'Runs dependency-free FR-AUD-001 append-only audit validation.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.fontainerepublic.server.audit.AuditFoundationTestMain'
}

tasks.register('subjectRegistryFoundationTest', JavaExec) {
    group = 'verification'
    description = 'Runs dependency-free FR-ID-001 subject registry validation.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.fontainerepublic.server.registry.SubjectRegistryFoundationTestMain'
}

tasks.register('bootstrapFoundationTest', JavaExec) {
    group = 'verification'
    description = 'Runs dependency-free FR-ID-BOOTSTRAP-001 original-person bootstrap validation.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.fontainerepublic.server.registry.BootstrapFoundationTestMain'
}

tasks.named('check') {
    dependsOn tasks.named('playerDataTest')
    dependsOn tasks.named('networkFoundationTest')
    dependsOn tasks.named('commandFoundationTest')
    dependsOn tasks.named('durableCommitTest')
    dependsOn tasks.named('auditFoundationTest')
    dependsOn tasks.named('subjectRegistryFoundationTest')
    dependsOn tasks.named('bootstrapFoundationTest')
}
